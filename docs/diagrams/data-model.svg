<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 768"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(11,13,11,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f7591f"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a70c7"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f4ed"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Boundary: gateway component -->
  <rect x="40" y="60" width="1000" height="596" rx="8"
        fill="transparent" stroke="rgba(11,13,11,0.22)"
        stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="52" y="48" width="292" height="20" rx="2" fill="#f5f4ed"/>
  <text x="60" y="62" fill="#52534e" font-size="9" font-family="ui-monospace, monospace"
        letter-spacing="1.5">MCP-GATEWAY · TEN COMPONENT TABLES</text>

  <!-- ============================================================ -->
  <!-- Group: REGISTRY (left column)                                -->
  <!-- ============================================================ -->
  <text x="80" y="100" fill="#65655c" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">REGISTRY · WHAT THE GATEWAY SERVES</text>

  <!-- tools -->
  <rect x="80" y="112" width="440" height="64" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="112" width="440" height="64" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="136" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">tools</text>
  <rect x="416" y="124" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="460" y="134" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_name</text>
  <text x="96" y="158" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">functionHandle · inputSchema · metadata · mrtrArgs · mrtrGated</text>
  <text x="96" y="170" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">one row per registered tool</text>

  <!-- resources -->
  <rect x="80" y="188" width="440" height="52" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="188" width="440" height="52" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="212" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">resources</text>
  <rect x="416" y="200" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="460" y="210" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_uri</text>
  <text x="96" y="232" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">imperative catalog; declarative providers stay host-side</text>

  <!-- resourceTemplates -->
  <rect x="80" y="252" width="440" height="52" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="252" width="440" height="52" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="276" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">resourceTemplates</text>
  <rect x="392" y="264" width="112" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="448" y="274" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_uriTemplate</text>
  <text x="96" y="296" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">RFC 6570 patterns, same imperative-only rule</text>

  <!-- config -->
  <rect x="80" y="316" width="440" height="64" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="316" width="440" height="64" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="340" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">config</text>
  <rect x="416" y="328" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="460" y="338" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">SINGLETON</text>
  <text x="96" y="362" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">authServerUrl? · resourceUrl? · toolsFingerprint?</text>
  <text x="96" y="374" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">authorization is NOT stored here; it is a host callback</text>

  <!-- ============================================================ -->
  <!-- Group: TRANSPORT (right column, top)                         -->
  <!-- ============================================================ -->
  <text x="560" y="100" fill="#65655c" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">TRANSPORT · LEGACY SESSION ERA ONLY</text>

  <!-- sessions -->
  <rect x="560" y="112" width="440" height="64" rx="6" fill="#f5f4ed"/>
  <rect x="560" y="112" width="440" height="64" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="576" y="136" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">sessions</text>
  <rect x="880" y="124" width="104" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="932" y="134" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_sessionId</text>
  <text x="576" y="158" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">protocolVersion · createdAt · lastSeenAt</text>
  <text x="576" y="170" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">modern 2026-07-28 requests never touch this table</text>

  <!-- subscriptions -->
  <rect x="560" y="188" width="440" height="52" rx="6" fill="#f5f4ed"/>
  <rect x="560" y="188" width="440" height="52" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="576" y="212" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">subscriptions</text>
  <rect x="896" y="200" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="940" y="210" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_uri</text>
  <text x="576" y="232" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">intent only; hosts own notification delivery</text>

  <!-- ============================================================ -->
  <!-- Group: MULTI-ROUND TRIPS (right column, bottom)              -->
  <!-- ============================================================ -->
  <text x="560" y="272" fill="#65655c" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">MULTI-ROUND TRIPS · TTL-BOUNDED</text>

  <!-- mrtrRedemptions -->
  <rect x="560" y="284" width="440" height="64" rx="6" fill="#f5f4ed"/>
  <rect x="560" y="284" width="440" height="64" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="576" y="308" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">mrtrRedemptions</text>
  <rect x="896" y="296" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="940" y="306" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_jti</text>
  <text x="576" y="330" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">responsesDigest · expiresAt</text>
  <text x="576" y="342" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">one CONTINUATION, answered once; jti is fresh per round</text>

  <!-- mrtrChains (focal) -->
  <rect x="560" y="360" width="440" height="88" rx="6" fill="#f5f4ed"/>
  <rect x="560" y="360" width="440" height="88" rx="6"
        fill="rgba(247,89,31,0.06)" stroke="#f7591f" stroke-width="1"/>
  <text x="576" y="384" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">mrtrChains</text>
  <rect x="896" y="372" width="88" height="14" rx="2" fill="transparent"
        stroke="rgba(247,89,31,0.55)" stroke-width="0.8"/>
  <text x="940" y="382" fill="#b8410f" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX by_chainKey</text>
  <text x="576" y="406" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">resolution "dispatched"|"completed" · expiresAt</text>
  <text x="576" y="422" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">resolvedByJti · resolvedByDigest?</text>
  <text x="576" y="438" fill="#b8410f" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">one CHAIN, resolved once: keyed by the stable idempotency key</text>

  <!-- ============================================================ -->
  <!-- Group: AUDIT (full width)                                    -->
  <!-- ============================================================ -->
  <text x="80" y="404" fill="#65655c" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">AUDIT · GROWS WITH TRAFFIC</text>

  <rect x="80" y="416" width="440" height="96" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="416" width="440" height="96" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="440" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">audit</text>
  <rect x="440" y="428" width="64" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="472" y="438" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX ×5</text>
  <text x="96" y="462" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">entryType "tool"|"resource"|"task" · toolName · args · outcome</text>
  <text x="96" y="478" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">identitySubject · durationMs · errorCode? · errorMessage?</text>
  <text x="96" y="494" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">indexed by_toolName, by_resourceUri, by_taskId, by_entryType, by_outcome</text>
  <text x="96" y="506" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">task rows carry no payloads; a task run also writes its own tool row</text>

  <!-- ============================================================ -->
  <!-- Group: TASKS (left column, bottom)                           -->
  <!-- ============================================================ -->
  <text x="80" y="532" fill="#65655c" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">TASKS · POLL-FIRST, TTL-BOUNDED</text>

  <rect x="80" y="544" width="440" height="96" rx="6" fill="#f5f4ed"/>
  <rect x="80" y="544" width="440" height="96" rx="6"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="96" y="568" fill="#0b0d0b" font-size="13" font-weight="600"
        font-family="ui-monospace, monospace">tasks</text>
  <rect x="440" y="556" width="64" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="472" y="566" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX ×4</text>
  <text x="96" y="590" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">ownerSubject · scope? · toolName · status · args · caller?</text>
  <text x="96" y="606" fill="#65655c" font-size="10"
        font-family="ui-monospace, monospace">idempotencyKey · startedAt? · inputRound? · expiresAt</text>
  <text x="96" y="622" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">indexed by_taskId, by_owner_status, by_idempotencyKey, by_expiresAt</text>
  <text x="96" y="634" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace" font-style="italic">owner+scope bound: expired, foreign and out-of-scope ids answer alike</text>

  <!-- ============================================================ -->
  <!-- Retention panel                                              -->
  <!-- ============================================================ -->
  <rect x="560" y="464" width="440" height="152" rx="6" fill="#f5f4ed"/>
  <rect x="560" y="464" width="440" height="152" rx="6"
        fill="transparent" stroke="rgba(82,83,78,0.30)" stroke-width="0.8"
        stroke-dasharray="4,3"/>
  <text x="576" y="484" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">RETENTION · HOST-WIRED CRONS</text>

  <text x="576" y="508" fill="#0b0d0b" font-size="10"
        font-family="ui-monospace, monospace">pruneMrtrRedemptions</text>
  <text x="576" y="522" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">drains mrtrRedemptions AND mrtrChains, one cron</text>

  <text x="576" y="544" fill="#0b0d0b" font-size="10"
        font-family="ui-monospace, monospace">pruneSessions</text>
  <text x="576" y="558" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">idle legacy sessions, optional</text>

  <text x="576" y="576" fill="#0b0d0b" font-size="10"
        font-family="ui-monospace, monospace">pruneAuditEntries</text>
  <text x="712" y="576" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">audit rows past their window</text>

  <text x="576" y="598" fill="#0b0d0b" font-size="10"
        font-family="ui-monospace, monospace">pruneTasks</text>
  <text x="576" y="612" fill="#65655c" font-size="9"
        font-family="ui-monospace, monospace">expired tasks, any status: TTL is the execution deadline</text>

  <!-- ============================================================ -->
  <!-- Legend strip                                                 -->
  <!-- ============================================================ -->
  <line x1="40" y1="680" x2="1040" y2="680"
        stroke="rgba(11,13,11,0.10)" stroke-width="0.8"/>
  <text x="40" y="696" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" letter-spacing="1.5">LEGEND</text>

  <rect x="40" y="712" width="14" height="10" rx="2"
        fill="rgba(11,13,11,0.05)" stroke="#52534e" stroke-width="1"/>
  <text x="60" y="720" fill="#52534e" font-size="9">Component table</text>

  <rect x="200" y="712" width="14" height="10" rx="2"
        fill="rgba(247,89,31,0.06)" stroke="#f7591f" stroke-width="1"/>
  <text x="220" y="720" fill="#52534e" font-size="9">Resolves a chain exactly once</text>

  <rect x="440" y="712" width="40" height="14" rx="2" fill="transparent"
        stroke="rgba(82,83,78,0.50)" stroke-width="0.8"/>
  <text x="460" y="722" fill="#52534e" font-size="8"
        font-family="ui-monospace, monospace" text-anchor="middle"
        letter-spacing="0.7">IDX</text>
  <text x="488" y="720" fill="#52534e" font-size="9">Index</text>

  <text x="576" y="720" fill="#52534e" font-size="9"
        font-family="ui-monospace, monospace">name?</text>
  <text x="628" y="720" fill="#52534e" font-size="9">Optional field</text>

  <rect x="756" y="712" width="14" height="10" rx="2"
        fill="transparent" stroke="rgba(82,83,78,0.30)" stroke-width="0.8"
        stroke-dasharray="4,3"/>
  <text x="776" y="720" fill="#52534e" font-size="9">Host-wired retention, not a table</text>
</svg>
